name: json_form_engine
description: >-
  JSON-driven dynamic form builder for Flutter: validated, conditional,
  multi-step forms with 50+ field types, theming, and localization.
version: 0.3.1
homepage: https://github.com/rupeshrajak0285/json_form_engine
repository: https://github.com/rupeshrajak0285/json_form_engine
issue_tracker: https://github.com/rupeshrajak0285/json_form_engine/issues
topics:
  - form
  - dynamic-form
  - json
  - validation
  - ui

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Official flutter.dev plugins (first-party) powering the built-in
  # image / camera / file field types.
  image_picker: ^1.1.2
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
